# Tiny Tapeout project information
project:
  title:        "Voltage Sensor Profiling"      # Project title
  author:       "Brendan Ang"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Exploring on-die voltage profiling of the PDN"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     40000000  # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_bbawj_volt_profile"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "ro_sensor.sv"
    - "ro.sv"
    - "inv.sv"
    - "waster_array.sv"
    - "waster_array_sel.sv"
    - "pulse_gen.sv"
    - "carry_chain.sv"
    - "tdc.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "RO_SENSOR_EN"
  ui[1]: "TDC_EN"
  ui[2]: "TDC_EN_SEL"
  ui[3]: "WASTER_EN"
  ui[4]: "WASTER_SEL0"
  ui[5]: "WASTER_SEL1"
  ui[6]: "WASTER_SEL2"
  ui[7]: "WASTER_SEL3"

  # Outputs
  uo[0]: "RO_COUNT0"
  uo[1]: "RO_COUNT1"
  uo[2]: "RO_COUNT2"
  uo[3]: "RO_COUNT3"
  uo[4]: "RO_COUNT4"
  uo[5]: "RO_COUNT5"
  uo[6]: "RO_COUNT6"
  uo[7]: "RO_COUNT7"

  # Bidirectional pins
  uio[0]: "TDC_COUNT0"
  uio[1]: "TDC_COUNT1"
  uio[2]: "TDC_COUNT2"
  uio[3]: "TDC_COUNT3"
  uio[4]: "TDC_COUNT4"
  uio[5]: "TDC_COUNT5"
  uio[6]: "TDC_COUNT6"
  uio[7]: "TDC_COUNT7"

# Do not change!
yaml_version: 6
